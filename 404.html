<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rest day — Glovia</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAF6EF">
  <link rel="icon" href="/glovia-site/favicon.ico" sizes="any">
  <style>
    @font-face { font-family: "Playfair Display"; src: url("/glovia-site/assets/fonts/playfair-var.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "Playfair Display"; src: url("/glovia-site/assets/fonts/playfair-italic.woff2") format("woff2"); font-weight: 400 900; font-style: italic; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/glovia-site/assets/fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { --cream: #FAF6EF; --ink: #0A0A0A; --ink-2: #3D3833; --muted: #6E665E; --coral: #EE8A72; --ease: cubic-bezier(.16, 1, .3, 1); }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 24px 16px; overflow: hidden; text-align: center;
    }
    .glow {
      position: fixed; left: 50%; top: 46%; width: min(900px, 180vw); aspect-ratio: 1; transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, rgba(244, 160, 138, .30), rgba(232, 213, 183, .25) 45%, rgba(250, 246, 239, 0) 72%);
      pointer-events: none;
    }
    main { position: relative; display: grid; gap: 1.25rem; justify-items: center; max-width: 34rem; }
    .ring { width: 132px; height: 132px; position: relative; display: grid; place-items: center; margin-bottom: .5rem; }
    .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); overflow: visible; }
    .ring .arc { stroke-dasharray: 100; stroke-dashoffset: 30; }
    .ring span { font-family: "Playfair Display", Georgia, serif; font-size: 2.75rem; font-weight: 500; letter-spacing: -.03em; }
    .eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #A44E31; }
    h1 { margin: 0; font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: clamp(2.5rem, 1.4rem + 4.6vw, 4.75rem); line-height: 1.04; letter-spacing: -.03em; }
    p { margin: 0; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: clamp(1.125rem, 1rem + .5vw, 1.375rem); color: var(--ink-2); }
    a.btn {
      margin-top: 1rem; display: inline-flex; align-items: center; gap: .5rem; min-height: 46px; padding: .75rem 1.35rem;
      border-radius: 999px; background: var(--ink); color: var(--cream); text-decoration: none; font-weight: 550; font-size: .9375rem;
      box-shadow: 0 1px 2px rgba(70, 44, 24, .05), 0 4px 14px -4px rgba(70, 44, 24, .1);
      transition: transform .2s, box-shadow .2s;
    }
    a.btn:hover { transform: scale(1.02); box-shadow: 0 2px 6px rgba(70, 44, 24, .05), 0 28px 56px -18px rgba(120, 66, 36, .24); }
    a:focus-visible { outline: 2px solid #A44E31; outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      .ring .arc { animation: draw 1.6s var(--ease) .2s both; }
      main > * { animation: rise 1s var(--ease) both; }
      main > *:nth-child(2) { animation-delay: .5s; } main > *:nth-child(3) { animation-delay: .62s; }
      main > *:nth-child(4) { animation-delay: .74s; } main > *:nth-child(5) { animation-delay: .86s; }
      .glow { animation: breathe 9s ease-in-out infinite alternate; }
    }
    @keyframes draw { from { stroke-dashoffset: 100; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes breathe { to { transform: translate(-50%, -50%) scale(1.08); } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 132 132" fill="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8D5B7"/><stop offset=".55" stop-color="#E5B8B0"/><stop offset="1" stop-color="#EE8A72"/></linearGradient></defs>
        <circle cx="66" cy="66" r="62" stroke="rgba(64,44,28,.08)" stroke-width="1.5"/>
        <circle class="arc" cx="66" cy="66" r="62" pathLength="100" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>G</span>
    </div>
    <span class="eyebrow">404</span>
    <h1>This page took a rest day.</h1>
    <p>Rest is part of the routine. Let's get you back.</p>
    <a class="btn" href="/glovia-site/">Back to Glovia →</a>
  </main>
</body>
</html>
